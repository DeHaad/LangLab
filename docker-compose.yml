# Lokal ishlab chiqish uchun PostgreSQL + Redis
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: certlingo
      POSTGRES_PASSWORD: certlingo
      POSTGRES_DB: certlingo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
